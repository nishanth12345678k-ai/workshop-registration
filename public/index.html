<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Workshop Registration</title>

</head>

<body>

    <h1>Workshop Registration Form</h1>

    <form action="/register" method="POST">

        <label>Full Name:</label>

        <input type="text"
               name="fullName"
               required>

        <br><br>


        <label>Email Address:</label>

        <input type="email"
               name="email"
               required>

        <br><br>


        <label>Workshop Name:</label>

        <input type="text"
               name="workshopName"
               required>

        <br><br>


        <label>Number of Participants:</label>

        <input type="number"
               name="participants"
               min="1"
               required>

        <br><br>


        <button type="submit">
            Register
        </button>

    </form>

</body>

</html>
